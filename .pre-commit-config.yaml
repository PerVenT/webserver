repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        description: Runs hadolint from .venv to lint Dockerfiles
        language: system
        types: [dockerfile]
        entry: .venv/bin/hadolint

      - id: shellcheck
        name: ShellCheck
        description: Static analysis tool for shell scripts
        language: system
        types: [shell]
        entry: .venv/bin/shellcheck
